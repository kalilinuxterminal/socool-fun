<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Neon Racer 3D · socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#05050f;color:#fff;overflow:hidden;height:100vh}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;letter-spacing:1px;text-shadow:0 0 12px #0ff;pointer-events:none;z-index:5}
  #hud .right{text-align:right}
  #over,#start{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:rgba(3,3,12,.78);backdrop-filter:blur(8px);z-index:10;text-align:center;padding:20px}
  #over{display:none}
  h1{font-size:clamp(30px,7vw,58px);font-weight:900;background:linear-gradient(90deg,#ff2fb3,#7c3aed,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,47,179,.5))}
  .btn{font-size:17px;font-weight:800;letter-spacing:2px;background:#fff;color:#000;border:0;border-radius:100px;padding:14px 44px;cursor:pointer}
  .btn:hover{transform:scale(1.05)}
  .keys{font-size:13px;color:#999}
  #touch{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;padding:0 14px 18px;z-index:6}
  #touch button{width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:900}
  #touch button:active{background:rgba(255,255,255,.35)}
  @media(pointer:coarse){#touch{display:flex}}
  a.home{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#777;font-size:12px;z-index:6;text-decoration:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud"><div><span id="speed">0</span> km/h</div><div class="right">SCORE <span id="score">0</span><br><span id="best" style="font-size:12px;color:#8ef">BEST 0</span></div></div>
<div id="start"><h1>NEON RACER 3D</h1><div class="keys">◀ ▶ steer · ▲ gas · ▼ brake · touch buttons on mobile</div><button class="btn" id="go">DRIVE ▸</button></div>
<div id="over"><h1>WRECKED</h1><div class="keys" id="final"></div><button class="btn" id="again">RETRY ▸</button></div>
<div id="touch"><div><button id="tL">◀</button> <button id="tR">▶</button></div><div><button id="tB">▼</button> <button id="tG">▲</button></div></div>
<a class="home" href="index.html">← socool.fun</a>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
// ---------- track ----------
const SEG=200,ROAD=1100,CAMH=1050,DRAW=160;
let segs=[];
function genSeg(i){ // absolute segment index
  const prev=segs.length?segs[segs.length-1]:{curve:0,y:0,cx:0};
  let curve=prev.curve,y=prev.y;
  if(i%110===0){curve=(Math.random()*2-1)*2.4;y+=(Math.random()*2-1)*1400;y=Math.max(-2600,Math.min(2600,y))}
  const cx=prev.cx+curve*55;
  const s={curve:curve,y:y,cx:cx,traff:null};
  if(i>30&&Math.random()<0.055)s.traff={off:Math.random()*1.7-0.85,col:['#ff2fb3','#00e5ff','#ffe14d','#7CFC00'][Math.floor(Math.random()*4)]};
  return s;
}
function ensure(n){while(segs.length<=n)segs.push(genSeg(segs.length))}
// ---------- state ----------
let pos=0,speed=0,score=0,over=false,started=false,playerX=0;
let best=+(localStorage.getItem('sc_racer')||0);
document.getElementById('best').textContent='BEST '+best;
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key]=false});
function bind(id,k){const b=document.getElementById(id);const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)}
bind('tL','ArrowLeft');bind('tR','ArrowRight');bind('tG','ArrowUp');bind('tB','ArrowDown');
// engine hum
let AC=null,osc=null,og=null;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();osc=AC.createOscillator();og=AC.createGain();osc.type='sawtooth';osc.frequency.value=55;og.gain.value=0;osc.connect(og);og.connect(AC.destination);osc.start()}catch(e){}}
function proj(wx,wy,wz,camX,camY,camZ){const d=Math.max(5,wz-camZ),s=900/d;return{x:W/2+(wx-camX)*s,y:H*0.55-(wy-camY)*s,w:s}}
function poly(x1,y1,x2,y2,x3,y3,x4,y4){x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.lineTo(x3,y3);x.lineTo(x4,y4);x.closePath();x.fill()}
function frame(dt){
  const maxS=280;
  if(started&&!over){
    if(keys['ArrowUp'])speed=Math.min(maxS,speed+95*dt);
    else if(keys['ArrowDown'])speed=Math.max(0,speed-170*dt);
    else speed=Math.max(0,speed-24*dt);
    const grip=0.35+0.65*(speed/maxS);
    if(keys['ArrowLeft'])playerX=Math.max(-1.5,playerX-1.7*dt*grip);
    if(keys['ArrowRight'])playerX=Math.min(1.5,playerX+1.7*dt*grip);
    pos+=speed*dt*10;score+=speed*dt*0.5;
    if(osc&&og){osc.frequency.value=50+speed*1.5;og.gain.value=0.045}
    const psi=Math.floor(pos/SEG)+2;
    ensure(psi+4);
    const t=segs[psi]&&segs[psi].traff;
    if(t&&speed>45&&Math.abs(playerX-t.off)<0.3){gameOver()}
  }
  // sky
  const sky=x.createLinearGradient(0,0,0,H*0.56);sky.addColorStop(0,'#030312');sky.addColorStop(0.62,'#1b0b3d');sky.addColorStop(1,'#ff2fb355');x.fillStyle=sky;x.fillRect(0,0,W,H*0.56+1);
  x.fillStyle='#fff';x.shadowColor='#f0f';x.shadowBlur=42;x.beginPath();x.arc(W*0.78,H*0.15,Math.min(W,H)*0.055,0,7);x.fill();x.shadowBlur=0;
  x.fillStyle='#0d0d24';x.beginPath();x.moveTo(0,H*0.56);
  for(let i=0;i<=W;i+=36)x.lineTo(i,H*0.56-24-Math.abs(Math.sin(i*0.011+pos*0.00012))*64);
  x.lineTo(W,H*0.56);x.closePath();x.fill();
  x.fillStyle='#070714';x.fillRect(0,H*0.56,W,H*0.44+2);
  // road
  ensure(Math.floor(pos/SEG)+DRAW+4);
  const base=Math.floor(pos/SEG),basePct=(pos%SEG)/SEG;
  const bseg=segs[base];
  const camY=bseg.y+CAMH, camX=bseg.cx+playerX*1500;
  let maxY=H;
  for(let n=0;n<DRAW;n++){
    const i0=base+n,s0=segs[i0],s1=segs[i0+1];
    const z0=i0*SEG-pos,z1=(i0+1)*SEG-pos;
    if(z1<8)continue;
    const q0=proj(s0.cx,s0.y,i0*SEG,camX,camY,pos);
    const q1=proj(s1.cx,s1.y,(i0+1)*SEG,camX,camY,pos);
    if(q0.y>=maxY)continue;maxY=q0.y;
    const alt=Math.floor(i0/3)%2;
    x.fillStyle=alt?'#0b0b1c':'#0d0d22';x.fillRect(0,q1.y,W,q0.y-q1.y+1);
    const r0=q0.w*1.35,r1=q1.w*1.35,w0=q0.w*1.05,w1=q1.w*1.05;
    x.fillStyle=alt?'#ff2fb3':'#dfe3f5';poly(q0.x-r0,q0.y,q0.x+r0,q0.y,q1.x+r1,q1.y,q1.x-r1,q1.y);
    x.fillStyle=alt?'#14142c':'#171738';poly(q0.x-w0,q0.y,q0.x+w0,q0.y,q1.x+w1,q1.y,q1.x-w1,q1.y);
    if(alt){x.fillStyle='#00e5ff';const l0=q0.w*0.07,l1=q1.w*0.07;
      [-0.5,0.5].forEach(o=>{poly(q0.x+o*w0-l0,q0.y,q0.x+o*w0+l0,q0.y,q1.x+o*w1+l1,q1.y,q1.x+o*w1-l1,q1.y)})}
    if(s0.traff){const tz=i0*SEG-pos;if(tz>8){const tp=proj(s0.cx+s0.traff.off*ROAD*0.9,s0.y,i0*SEG,camX,camY,pos);
      const tw=tp.w*0.62,th=tw*0.55;
      x.fillStyle=s0.traff.col;x.shadowColor=s0.traff.col;x.shadowBlur=16;
      x.fillRect(tp.x-tw/2,tp.y-th,tw,th*0.62);x.fillRect(tp.x-tw*0.36,tp.y-th*1.5,tw*0.72,th*0.55);x.shadowBlur=0;
      x.fillStyle='#05050f';x.fillRect(tp.x-tw*0.36,tp.y-th*1.42,tw*0.72,th*0.4)}}
  }
  // player car
  const cw=Math.min(W,H)*0.17,py=H-cw*0.24;
  x.fillStyle='#0a0a14';x.fillRect(W/2-cw/2,py-cw*0.05,cw,cw*0.16);
  x.fillStyle='#ff2fb3';x.shadowColor='#ff2fb3';x.shadowBlur=26;
  x.beginPath();x.moveTo(W/2-cw/2,py);x.lineTo(W/2-cw/2,py-cw*0.34);x.lineTo(W/2-cw*0.27,py-cw*0.5);x.lineTo(W/2+cw*0.27,py-cw*0.5);x.lineTo(W/2+cw/2,py-cw*0.34);x.lineTo(W/2+cw/2,py);x.closePath();x.fill();x.shadowBlur=0;
  x.fillStyle='#0af';x.fillRect(W/2-cw*0.27,py-cw*0.47,cw*0.54,cw*0.15);
  x.fillStyle='#fff';x.fillRect(W/2-cw/2+4,py-8,16,6);x.fillRect(W/2+cw/2-20,py-8,16,6);
  // speed lines
  if(speed>200){x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;for(let i=0;i<8;i++){const yy=Math.random()*H;x.beginPath();x.moveTo(0,yy);x.lineTo(30+speed*0.15,yy);x.stroke()}}
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('score').textContent=Math.round(score);
}
function gameOver(){over=true;if(og)og.gain.value=0;const s=Math.round(score);if(window.__submitScore)__submitScore('racer',s);if(s>best){best=s;localStorage.setItem('sc_racer',best);document.getElementById('best').textContent='BEST '+best}
  document.getElementById('final').textContent='score '+s+' · best '+best;document.getElementById('over').style.display='flex'}
function reset(){over=false;speed=0;score=0;playerX=0;pos=0;document.getElementById('over').style.display='none'}
document.getElementById('go').onclick=()=>{audio();if(AC&&AC.state==='suspended')AC.resume();document.getElementById('start').style.display='none';started=true};
document.getElementById('again').onclick=()=>{reset()};
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const now=t||performance.now();const dt=Math.min(0.05,(now-last)/1000);last=now;if(!document.hidden)frame(dt)})()
</script>
