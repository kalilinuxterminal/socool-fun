function normName(s){return (s||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16)}
function variants(s){
  const maps=[
    {'$':'s','0':'o','1':'i','!':'i','|':'i','3':'e','4':'a','@':'a','5':'s','7':'t','+':'t','8':'b','9':'g','2':'z'},
    {'$':'g','0':'o','1':'i','!':'i','|':'i','3':'e','4':'a','@':'a','5':'s','7':'t','+':'t','8':'b','9':'g','2':'z'}
  ];
  const out=[];
  const src=(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  for(const M of maps){
    let t='';
    for(const ch of src){if(M[ch])t+=M[ch];else if(/[a-z]/.test(ch))t+=ch}
    t=t.replace(/(.)\1{2,}/g,'$1$1');
    out.push(t,t.replace(/l/g,'i'));
  }
  return [...new Set(out)];
}
const BAD_SUB=['nigger','nigga','nigg','faggot','fagot','hitler','nazi','kike','chink','spic','retard','whore','whroe','slut','porn','fuck','fck','fuk','fvck','shit','bitch','cunt','dick','cock','pussy','rape','molest','kkk'];
const BAD_TOKEN=new Set(['nga','ncr','nig','kys','ass','sex','cum','hoe','fag']);
function isClean(text){
  const raw=(text||'').trim();
  if(!raw)return true;
  const tokens=raw.toLowerCase().split(/[^a-z0-9$|!@]+/).filter(Boolean);
  for(const t of tokens){
    for(const v of variants(t)){if(BAD_TOKEN.has(t)||BAD_TOKEN.has(v))return false}
  }
  for(const v of variants(raw)){
    for(const w of BAD_SUB){if(v.includes(w))return false}
  }
  return true;
}
async function genKeys(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  return{pub:await crypto.subtle.exportKey('jwk',kp.publicKey),priv:await crypto.subtle.exportKey('jwk',kp.privateKey)}}
async function sharedKey(theirJwk){const mine=await crypto.subtle.importKey('jwk',JSON.parse(localStorage.sc_priv),'ECDH',{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  const theirs=await crypto.subtle.importKey('jwk',theirJwk,{name:'ECDH',namedCurve:'P-256'},true,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:theirs},mine,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function keyFor(uid,pub){
  if(!pub)throw new Error('missing key for '+(uid===ME?'you':'them'));
  const ck=uid+'|'+pub.x+'|'+pub.y;
  if(KEYS.has(ck))return KEYS.get(ck);
  const k=await sharedKey(pub);KEYS.set(ck,k);return k;
}
async function pubOf(uid,meta){
  if(meta.pubs&&meta.pubs[uid])return meta.pubs[uid];
  const d=await DB.collection('users').doc(uid).get().catch(()=>null);
  if(d&&d.exists&&d.data().pub){meta.pubs=meta.pubs||{};meta.pubs[uid]=d.data().pub;return d.data().pub}
  throw new Error('their key is not available yet');
}
async function enc(key,t){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(t)));
  return{iv:b64(iv),ct:b64(ct)}}
async function dec(key,m){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(m.iv)},key,unb(m.ct));
  return new TextDecoder().decode(pt)}catch(e){return'[undecryptable — keys changed]'}}
async function encBytes(key,u8){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8));
  return{iv:b64(iv),ct:b64(ct)}}
async function decBytes(key,m){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(m.iv)},key,unb(m.ct)))}
async function claimName(nm){
  const key=normName(nm);
  if(key.length<3)throw new Error('name needs 3+ letters or numbers');
  if(!isClean(nm)||!isClean(key))throw new Error('that name is not allowed');
  await DB.runTransaction(async tx=>{
    const codeRef=DB.collection('codes').doc(key);
    const codeDoc=await tx.get(codeRef);
    if(codeDoc.exists&&codeDoc.data().uid!==ME)throw new Error('name taken, pick another');
    tx.set(codeRef,{uid:ME});
  });
  try{await DB.collection('names').doc(key).set({uid:ME,name:nm.trim().slice(0,16)})}catch(e){}
  return key;
}
async function lookupUser(q){
  const key=normName(q);
  if(!key)return null;
  try{
    const byName=await DB.collection('names').doc(key).get();
    if(byName.exists)return byName.data().uid;
  }catch(e){}
  const byCode=await DB.collection('codes').doc(key).get();
  if(byCode.exists)return byCode.data().uid;
  try{
    const snap=await DB.collection('users').where('nameLower','==',key).limit(1).get();
    if(!snap.empty)return snap.docs[0].id;
  }catch(e){}
  return null;
}

async function init(){
  if(typeof firebase==='undefined'){$('setup').style.display='flex';$('serr').textContent='could not reach the chat servers from this network.';return}
  if(!ok()){$('setup').style.display='flex';$('serr').textContent='chat not connected yet — owner is wiring it up.';return}
  firebase.initializeApp(CONFIG);DB=firebase.firestore();
  try{ST=firebase.storage()}catch(e){ST=null}
  let me=null;
  try{
    await firebase.auth().signInAnonymously();ME=firebase.auth().currentUser.uid;
    me=await DB.collection('users').doc(ME).get();
  }catch(e){$('setup').style.display='flex';$('serr').textContent='blocked: '+e.message;return}
  $('go').disabled=false;$('go').textContent='START ▸';
  if(me.exists&&localStorage.sc_priv){
    const p=JSON.parse(localStorage.sc_name||'null')||me.data();
    if(p&&p.name&&isClean(p.name)){start(p);return}
  }
  $('setup').style.display='flex';
  $('go').onclick=async()=>{
    $('serr').textContent='';
    const nm=$('nm').value.trim().slice(0,16);
    if(!nm){$('serr').textContent='need a display name';return}
    if(!isClean(nm)){$('serr').textContent='that name is not allowed';return}
    try{
      const key=await claimName(nm);
      let pub=null;
      if(localStorage.sc_priv){
        pub=(me&&me.exists&&me.data().pub)||(JSON.parse(localStorage.sc_name||'null')||{}).pub||null;
      }
      if(!localStorage.sc_priv||!pub){
        const k=await genKeys();
        localStorage.sc_priv=JSON.stringify(k.priv);
        pub=k.pub;
      }
      const profile={name:nm,nameLower:key,pub};
      localStorage.sc_name=JSON.stringify(profile);
      await DB.collection('users').doc(ME).set(profile,{merge:true});
      start(profile);
    }catch(err){$('serr').textContent=err.message||'could not save name'}
  };
}
function start(p){

  $('setup').style.display='none';$('app').style.display='grid';
  $('meName').innerHTML='signed in as <b></b>';$('meName').querySelector('b').textContent=p.name;

  $('invb').onclick=invite;
  $('inv').addEventListener('keydown',e=>{if(e.key==='Enter')invite()});

let CHATMETA=null;
async function openChat(cid,meta){
  OPEN=cid;CHATMETA={meta:meta};
  const other=meta.group?null:meta.members.find(u=>u!==ME);
  CHATMETA.other=other;

  if(meta.group&&!mine){
    const s=document.createElement('span');s.className='sender';
    s.textContent=(meta.names&&meta.names[m.from])||'member';el.appendChild(s);
  }
  if(m.type==='file'){
    const slot=m.fk&&m.fk[ME];
    if(!slot)throw new Error('no key for you');
    const wrapKey=await memberKey(meta,m.from);
    const rawKey=await decBytes(wrapKey,slot);
    const fileKey=await crypto.subtle.importKey('raw',rawKey,{name:'AES-GCM'},false,['decrypt']);
    let cipher;
    if(ST){const url=await ST.ref().child(m.path).getDownloadURL();cipher=await (await fetch(url)).arrayBuffer()}
    else{throw new Error('storage unavailable')}
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(m.fiv)},fileKey,cipher);
    const isImg=/\.(png|jpe?g|gif|webp|bmp)$/i.test(m.fname||'');
    const mime=isImg?'image/'+((m.fname.split('.').pop()||'png').toLowerCase().replace('jpg','jpeg')):'application/octet-stream';
    const url=URL.createObjectURL(new Blob([plain],{type:mime}));OURLS.push(url);
    const box=document.createElement('div');box.className='file';
    if(isImg){const img=document.createElement('img');img.src=url;img.onclick=()=>window.open(url,'_blank');box.appendChild(img)}
    const a=document.createElement('a');a.href=url;a.download=m.fname||'file';a.textContent='DOWNLOAD '+(m.fname||'file')+' ('+Math.round((m.fsize||plain.byteLength)/1024)+'KB)';
    box.appendChild(a);el.appendChild(box);M.appendChild(el);return;
  }
  let txt;
  if(m.rcpt){
    const slot=m.rcpt[ME];if(!slot)throw new Error('no copy for you');
    const k=await memberKey(meta,m.from);
    txt=await dec(k,slot);
  }else if(m.iv){
    const k=await memberKey(meta,m.from);
    txt=await dec(k,m);
  }else throw new Error('bad message');
  const clean=isClean(txt);
  el.className+=clean?'':' blocked';
  el.textContent=clean?txt:'blocked';
  M.appendChild(el);
}
async function send(){
  $('merr').textContent='';
  const t=$('box').value.trim();
  if(!t)return;
  if(!OPEN){$('merr').textContent='open a chat first';return}
  if(!isClean(t)){$('merr').textContent='that message is not allowed';return}
  $('box').value='';
  try{
    const meta=CHATMETA.meta;
    if(meta.group){
      const rcpt={};
      for(const uid of meta.members){
        const k=await memberKey(meta,uid);
        rcpt[uid]=await enc(k,t);
      }
      await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,rcpt:rcpt,ts:Date.now()});
    }else{
      const k=await memberKey(meta,CHATMETA.other);
      const e=await enc(k,t);
      await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,iv:e.iv,ct:e.ct,ts:Date.now()});
    }
    await DB.collection('chats').doc(OPEN).update({updated:Date.now()});
  }catch(e){$('merr').textContent='send failed: '+(e.message||e)}
}
async function attach(){
  const f=$('file').files[0];$('file').value='';
  if(!f)return;
  if(!OPEN){$('merr').textContent='open a chat first';return}
  if(f.size>8*1024*1024){$('merr').textContent='file too big (max 8MB)';return}
  $('merr').textContent='';
  try{
    if(!ST)throw new Error('storage unavailable');
    const meta=CHATMETA.meta;
    const buf=new Uint8Array(await f.arrayBuffer());
    const fk=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
    const fiv=crypto.getRandomValues(new Uint8Array(12));
    const body=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:fiv},fk,buf));
    const raw=new Uint8Array(await crypto.subtle.exportKey('raw',fk));
    const members=meta.group?meta.members:[ME,CHATMETA.other];
    const wraps={};
    for(const uid of members){
      const k=await memberKey(meta,uid);
      wraps[uid]=await encBytes(k,raw);
    }
    const path='chats/'+OPEN+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
    await ST.ref().child(path).put(body);
    const fname=(isClean(f.name)?f.name:'[file]').slice(0,40);
    await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,type:'file',fname:fname,fsize:f.size,fiv:b64(fiv),path:path,fk:wraps,ts:Date.now()});
    await DB.collection('chats').doc(OPEN).update({updated:Date.now()});
  }catch(e){$('merr').textContent='attach failed: '+(e.message||e)}
}
async function invite(){
  $('merr').textContent='';
  const q=$('inv').value.trim();
  if(!q||!OPEN||!CHATMETA.meta.group)return;
  try{
    const to=await lookupUser(q);
    if(!to){$('merr').textContent='nobody has that name';return}
    if(to===ME){$('merr').textContent='that is you';return}
    if(CHATMETA.meta.members.includes(to)){$('merr').textContent='already in the group';return}
    const rid=ME+'_'+to+'_'+OPEN;
    const ex=await DB.collection('requests').doc(rid).get();
    if(ex.exists&&ex.data().status==='pending'){$('merr').textContent='already invited';return}
    await DB.collection('requests').doc(rid).set({from:ME,to:to,type:'group',gid:OPEN,gname:CHATMETA.meta.name,fromName:MEP.name,status:'pending',ts:Date.now()});
    $('inv').value='';$('merr').className='okmsg';$('merr').textContent='invited';
    setTimeout(()=>{if($('merr').textContent==='invited'){$('merr').textContent='';$('merr').className=''}},2600);
  }catch(e){$('merr').textContent='invite failed: '+(e.message||e)}
}
(function(){
  const c=document.getElementById('fx'),x=c.getContext('2d');
  let w,h,dots;
  const reset=()=>{w=c.width=innerWidth;h=c.height=innerHeight;dots=Array.from({length:36},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,s:Math.random()*.35+.08,a:Math.random()*.4+.12}))};
  reset();addEventListener('resize',reset);
  (function draw(){x.clearRect(0,0,w,h);dots.forEach(d=>{d.y-=d.s;if(d.y<0)d.y=h;x.beginPath();x.fillStyle='rgba(255,255,255,'+d.a+')';x.arc(d.x,d.y,d.r,0,6.28);x.fill()});requestAnimationFrame(draw)})();
})();
if(document.readyState==='loading')addEventListener('DOMContentLoaded',init);else init();
</script>
