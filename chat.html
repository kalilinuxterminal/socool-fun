function variants(s){
  const maps=[
    {'$':'s','0':'o','1':'i','!':'i','|':'i','3':'e','4':'a','@':'a','5':'s','7':'t','+':'t','8':'b','9':'g','2':'z'},
    {'$':'g','0':'o','1':'i','!':'i','|':'i','3':'e','4':'a','@':'a','5':'s','7':'t','+':'t','8':'b','9':'g','2':'z'}

    if(!s.empty){const lab=document.createElement('div');lab.style.cssText='font-size:11px;color:#888';lab.textContent='REQUESTS';R.appendChild(lab)}
    s.forEach(d=>{const r=d.data();const el=document.createElement('div');el.className='item';
      const b=document.createElement('b');b.textContent=r.fromName||'someone';
      const sm=document.createElement('small');
      sm.textContent=r.type==='group'?('invited you to group "'+(r.gname||'group')+'"'):'wants to chat — accept to start';
      el.appendChild(b);el.appendChild(sm);
      const row=document.createElement('div');row.className='row';row.style.marginTop='6px';
      const okB=document.createElement('button');okB.textContent='ACCEPT';
      okB.onclick=async()=>{
        try{
          if(r.type==='group'){
            await DB.collection('chats').doc(r.gid).update({members:firebase.firestore.FieldValue.arrayUnion(ME),
              ['names.'+ME]:p.name,['pubs.'+ME]:p.pub,updated:Date.now()});
          }else{
            const cid=[ME,r.from].sort().join('_');
            await DB.collection('chats').doc(cid).set({members:[ME,r.from],names:{[ME]:p.name,[r.from]:r.fromName},
              pubs:{[ME]:p.pub,[r.from]:r.fromPubKey},updated:Date.now()},{merge:true});
          }
          await DB.collection('requests').doc(d.id).update({status:'accepted'});
        }catch(e){alert('accept failed: '+(e.message||e))}
      };
      const no=document.createElement('button');no.textContent='NO';no.className='ghost';
      no.onclick=()=>DB.collection('requests').doc(d.id).update({status:'declined'});
      row.appendChild(okB);row.appendChild(no);el.appendChild(row);R.appendChild(el)});
  },err=>{});
  DB.collection('chats').where('members','array-contains',ME).onSnapshot(s=>{
    const C=$('chats');C.textContent='';
    const docs=[...s.docs].sort((a,b)=>((b.data().updated||0)-(a.data().updated||0)));
    if(!docs.length){const d=document.createElement('div');d.className='note';d.textContent='no chats yet — add someone above';C.appendChild(d)}
    docs.forEach(d=>{const c=d.data();const other=c.members.find(u=>u!==ME);
      const el=document.createElement('div');el.className='item'+(OPEN===d.id?' act':'');
      const b=document.createElement('b');b.textContent=c.group?(c.name||'group'):((c.names&&c.names[other])||'chat');
      const sm=document.createElement('small');
      sm.textContent=c.group?('group · '+c.members.length+' · code '+((c.joinCode||'------').toUpperCase())):'end-to-end encrypted';
      el.appendChild(b);el.appendChild(sm);
      if(!c.group){const dot=document.createElement('span');dot.className='dot';
        el.insertBefore(dot,sm);
        getPres(other).then(on=>{dot.className='dot'+(on?' on':'')});}
      el.onclick=()=>openChat(d.id,c);C.appendChild(el)});
  },err=>{const C=$('chats');C.textContent='';const d=document.createElement('div');d.className='note';
    d.textContent='chat list error: '+err.code;C.appendChild(d)});
  $('send').onclick=send;
  $('box').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  $('box').addEventListener('input',onType);
  $('att').onclick=()=>$('file').click();
  $('file').onchange=sendImage;
  $('mic').onclick=toggleMic;
  $('invb').onclick=invite;
  $('inv').addEventListener('keydown',e=>{if(e.key==='Enter')invite()});
  $('rnb').onclick=renameGroup;
  $('ghostb').onclick=toggleGhost;
}
let CHATMETA=null;
function onType(){
  if(!OPEN)return;
  if(!typingSent){typingSent=true;
    DB.collection('chats').doc(OPEN).update({['typing.'+ME]:Date.now()}).catch(()=>{});
    setTimeout(()=>typingSent=false,2000)}
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{DB.collection('chats').doc(OPEN).update({['typing.'+ME]:firebase.firestore.FieldValue.delete()}).catch(()=>{})},3000);
}
function clearTyping(){
  if(!OPEN)return;
  clearTimeout(typingTimer);typingSent=false;
  DB.collection('chats').doc(OPEN).update({['typing.'+ME]:firebase.firestore.FieldValue.delete()}).catch(()=>{});
}
async function openChat(cid,meta){
  OPEN=cid;CHATMETA={meta:meta};
  const other=meta.group?null:meta.members.find(u=>u!==ME);
  CHATMETA.other=other;
  document.querySelectorAll('#chats .item').forEach(e=>e.classList.remove('act'));
  $('ctitle').textContent=meta.group?(meta.name||'group'):((meta.names&&meta.names[other])||'chat');
  $('hdot').style.display=meta.group?'none':'inline-block';
  if(!meta.group){getPres(other).then(on=>{$('hdot').className='dot'+(on?' on':'')})}
  $('invrow').style.display=meta.group?'flex':'none';
  $('ghostb').style.display='inline-block';
  renderMeta(meta);
  if(innerWidth<640)$('listpane').classList.add('hide');
  if(UNSUB)UNSUB();if(UNSUBMETA)UNSUBMETA();
  UNSUBMETA=DB.collection('chats').doc(cid).onSnapshot(d=>{
    if(!d.exists)return;
    CHATMETA.meta=d.data();
    renderMeta(d.data());
  },err=>{});
  try{
    if(!meta.group){await keyFor(other,await pubOf(other,meta))}
    UNSUB=DB.collection('chats').doc(cid).collection('msgs').orderBy('ts').onSnapshot(async s=>{
      const M=$('msgs');
      OURLS.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});OURLS=[];
      M.textContent='';
      let docs=s.docs;
      if(CHATMETA.meta&&CHATMETA.meta.ghost){
        const cut=Date.now()-600000;
        s.docs.forEach(d=>{if((d.data().ts||0)<cut)d.ref.delete().catch(()=>{})});
        docs=docs.filter(d=>(d.data().ts||0)>=cut);
      }
      for(const d of docs){
        try{await renderMsg(d,M)}catch(e){
          const el=document.createElement('div');el.className='m them';el.textContent='[could not show a message]';M.appendChild(el)}
      }
      const last=M.lastElementChild;if(last)last.scrollIntoView({block:'nearest'});
    },err=>{$('msgs').textContent='';const n=document.createElement('div');n.className='note';n.textContent='messages error: '+err.code;$('msgs').appendChild(n)});
  }catch(e){
    $('msgs').textContent='';const n=document.createElement('div');n.className='note';
    n.textContent='could not open chat: '+(e.message||e);$('msgs').appendChild(n);
  }
}
function renderMeta(meta){
  if(!meta)return;
  $('ctitle').textContent=meta.group?(meta.name||'group'):((meta.names&&meta.names[CHATMETA.other])||'chat');
  $('csub').textContent=meta.group
    ?(meta.members.length+' members · code '+((meta.joinCode||'------').toUpperCase())+(meta.ghost?' · burning':''))
    :('end-to-end encrypted'+(meta.ghost?' · burning':''));
  $('ghostb').textContent='burn: '+(meta.ghost?'on':'off');
  const t=meta.typing||{};
  const now=Date.now();
  const names=[];
  for(const uid in t){if(uid!==ME&&now-t[uid]<4500){
    names.push((meta.names&&meta.names[uid])||'someone')}}
  $('typing').textContent=names.length?(names.join(', ')+(names.length>1?' are':' is')+' typing…'):'';
  const isOwner=meta.group&&meta.owner===ME;
  $('ownrow').style.display=isOwner?'flex':'none';
  $('memlist').style.display=isOwner?'flex':'none';
  if(isOwner)renderMembers(meta);
}
function renderMembers(meta){
  const L=$('memlist');L.textContent='';
  meta.members.forEach(uid=>{
    const chip=document.createElement('div');chip.className='chip';
    const nm=document.createElement('span');
    nm.textContent=(meta.names&&meta.names[uid])||'member'+(uid===meta.owner?' · owner':'');
    chip.appendChild(nm);
    if(uid!==ME){
      const k=document.createElement('button');k.textContent='KICK';
      k.onclick=async()=>{if(!confirm('kick this member?'))return;
        try{await DB.collection('chats').doc(OPEN).update({members:firebase.firestore.FieldValue.arrayRemove(uid),
          ['names.'+uid]:firebase.firestore.FieldValue.delete(),
          ['pubs.'+uid]:firebase.firestore.FieldValue.delete(),
          ['typing.'+uid]:firebase.firestore.FieldValue.delete()})}
        catch(e){alert('kick failed: '+(e.message||e))}};
      chip.appendChild(k);
    }
    L.appendChild(chip);
  });
}
async function renameGroup(){
  const n=$('rnm').value.trim().slice(0,24);
  if(!OPEN||!CHATMETA.meta.group)return;
  if(n.length<3){$('merr').textContent='name needs 3+ chars';return}
  if(!isClean(n)){$('merr').textContent='that name is not allowed';return}
  try{await DB.collection('chats').doc(OPEN).update({name:n});$('rnm').value='';$('merr').textContent=''}
  catch(e){$('merr').textContent='rename failed: '+(e.message||e)}
}
async function toggleGhost(){
  if(!OPEN)return;
  try{await DB.collection('chats').doc(OPEN).update({ghost:!(CHATMETA.meta&&CHATMETA.meta.ghost)})}
  catch(e){$('merr').textContent='toggle failed: '+(e.message||e)}
}
async function renderMsg(d,M){
  const m=d.data(),meta=CHATMETA.meta,mine=m.from===ME;
  const el=document.createElement('div');el.className='m '+(mine?'me':'them');
  if(m.type==='img'||m.type==='voice'){
    const dataUrl=await hybridDecrypt(meta,m,m.from);
    if(m.type==='img'){const img=document.createElement('img');img.src=dataUrl;el.appendChild(img)}
    else{const au=document.createElement('audio');au.controls=true;au.src=dataUrl;el.appendChild(au)}
  }else{
    let txt;
    if(m.rcpt){
      const slot=m.rcpt[ME];if(!slot)throw new Error('no copy for you');
      const k=await memberKey(meta,m.from);
      txt=await dec(k,slot);
    }else if(m.iv){
      const k=await memberKey(meta,m.from);
      txt=await dec(k,m);
    }else throw new Error('bad message');
    if(meta.group&&!mine){
      const s=document.createElement('span');s.className='sender';
      s.textContent=(meta.names&&meta.names[m.from])||'member';el.appendChild(s);
    }
    const clean=isClean(txt);
    el.className+=clean?'':' blocked';
    el.textContent=clean?txt:'blocked';
  }
  const rx=m.reactions||{};
  const counts={};
  for(const uid in rx){const c=rx[uid];counts[c]=(counts[c]||0)+1}
  const keys=Object.keys(counts);
  if(keys.length){
    const row=document.createElement('div');row.className='rx';
    keys.forEach(c=>{const sp=document.createElement('span');sp.textContent=c+' ×'+counts[c];row.appendChild(sp)});
    el.appendChild(row);
  }
  el.onclick=()=>{
    const ex=el.querySelector('.rbar');
    if(ex){ex.remove();return}
    document.querySelectorAll('.rbar').forEach(b=>b.remove());
    const bar=document.createElement('div');bar.className='rbar';
    REACTS.forEach(c=>{const b=document.createElement('button');b.textContent=c;
      b.onclick=async ev=>{ev.stopPropagation();bar.remove();
        try{
          const cur=(await DB.collection('chats').doc(OPEN).collection('msgs').doc(d.id).get()).data().reactions||{};
          if(cur[ME]===c)await DB.collection('chats').doc(OPEN).collection('msgs').doc(d.id).update({['reactions.'+ME]:firebase.firestore.FieldValue.delete()});
          else await DB.collection('chats').doc(OPEN).collection('msgs').doc(d.id).update({['reactions.'+ME]:c});
        }catch(e){$('merr').textContent='react failed: '+(e.message||e)}};
      bar.appendChild(b)});
    el.appendChild(bar);
  };
  M.appendChild(el);
}
async function send(){
  $('merr').textContent='';
  const t=$('box').value.trim();
  if(!t)return;
  if(!OPEN){$('merr').textContent='open a chat first';return}
  if(!isClean(t)){$('merr').textContent='that message is not allowed';return}
  $('box').value='';
  clearTyping();
  try{
    const meta=CHATMETA.meta;
    if(meta.group){
      const rcpt={};
      for(const uid of meta.members){
        const k=await memberKey(meta,uid);
        rcpt[uid]=await enc(k,t);
      }
      await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,rcpt:rcpt,ts:Date.now()});
    }else{
      const k=await memberKey(meta,CHATMETA.other);
      const e=await enc(k,t);
      await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,iv:e.iv,ct:e.ct,ts:Date.now()});
    }
    await DB.collection('chats').doc(OPEN).update({updated:Date.now()});
  }catch(e){$('merr').textContent='send failed: '+(e.message||e)}
}
async function sendImage(){
  const f=$('file').files[0];$('file').value='';
  if(!f)return;
  if(!OPEN){$('merr').textContent='open a chat first';return}
  $('merr').textContent='';
  try{
    const bmp=await createImageBitmap(f);
    const max=1280;let w=bmp.width,h=bmp.height;
    if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    let url=cv.toDataURL('image/jpeg',.72);
    if(url.length>700000)url=cv.toDataURL('image/jpeg',.42);
    if(url.length>720000){
      const s2=Math.min(1,960/Math.max(bmp.width,bmp.height));
      const cv2=document.createElement('canvas');
      cv2.width=Math.max(1,Math.round(bmp.width*s2));cv2.height=Math.max(1,Math.round(bmp.height*s2));
      cv2.getContext('2d').drawImage(bmp,0,0,cv2.width,cv2.height);
      url=cv2.toDataURL('image/jpeg',.42);
    }
    if(url.length>720000)throw new Error('image too large even after compression');
    const meta=CHATMETA.meta;
    const members=meta.group?meta.members:[ME,CHATMETA.other];
    const hy=await hybridEncrypt(meta,url,members);
    await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,type:'img',...hy,ts:Date.now()});
    await DB.collection('chats').doc(OPEN).update({updated:Date.now()});
  }catch(e){$('merr').textContent='image failed: '+(e.message||e)}
}
async function toggleMic(){
  if(REC&&REC.state==='recording'){REC.stop();return}
  $('merr').textContent='';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    RECS=[];REC=new MediaRecorder(stream);
    REC.ondataavailable=e=>RECS.push(e.data);
    REC.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());clearTimeout(RECTO);
      $('mic').textContent='MIC';$('mic').className='ghost';
      const blob=new Blob(RECS,{type:REC?REC.mimeType:'audio/webm'});REC=null;
      if(blob.size<1000)return;
      if(blob.size>500*1024){$('merr').textContent='voice note too long (max ~30s)';return}
      if(!OPEN){$('merr').textContent='open a chat first';return}
      try{
        const b64data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)});
        const meta=CHATMETA.meta;
        const members=meta.group?meta.members:[ME,CHATMETA.other];
        const hy=await hybridEncrypt(meta,b64data,members);
        await DB.collection('chats').doc(OPEN).collection('msgs').add({from:ME,type:'voice',...hy,ts:Date.now()});
        await DB.collection('chats').doc(OPEN).update({updated:Date.now()});
      }catch(e){$('merr').textContent='voice failed: '+(e.message||e)}
    };
    REC.start();$('mic').textContent='STOP';$('mic').className='';
    RECTO=setTimeout(()=>{if(REC&&REC.state==='recording')REC.stop()},45000);
  }catch(e){$('merr').textContent='mic blocked: '+(e.message||e)}
}
async function invite(){
  $('merr').textContent='';
  const q=$('inv').value.trim();
  if(!q||!OPEN||!CHATMETA.meta.group)return;
  try{
    const to=await lookupUser(q);
    if(!to){$('merr').textContent='nobody has that name';return}
    if(to===ME){$('merr').textContent='that is you';return}
    if(CHATMETA.meta.members.includes(to)){$('merr').textContent='already in the group';return}
    const rid=ME+'_'+to+'_'+OPEN;
    const ex=await DB.collection('requests').doc(rid).get().catch(()=>null);
    if(ex&&ex.exists&&ex.data().status==='pending'){$('merr').textContent='already invited';return}
    await DB.collection('requests').doc(rid).set({from:ME,to:to,type:'group',gid:OPEN,gname:CHATMETA.meta.name,fromName:MEP.name,status:'pending',ts:Date.now()});
    $('inv').value='';$('merr').className='okmsg';$('merr').textContent='invited';
    setTimeout(()=>{if($('merr').textContent==='invited'){$('merr').textContent='';$('merr').className=''}},2600);
  }catch(e){$('merr').textContent='invite failed: '+(e.message||e)}
}
(function(){
  const c=document.getElementById('fx'),x=c.getContext('2d');
  let w,h,dots;
  const reset=()=>{w=c.width=innerWidth;h=c.height=innerHeight;dots=Array.from({length:36},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,s:Math.random()*.35+.08,a:Math.random()*.4+.12}))};
  reset();addEventListener('resize',reset);
  (function draw(){x.clearRect(0,0,w,h);dots.forEach(d=>{d.y-=d.s;if(d.y<0)d.y=h;x.beginPath();x.fillStyle='rgba(255,255,255,'+d.a+')';x.arc(d.x,d.y,d.r,0,6.28);x.fill()});requestAnimationFrame(draw)})();
})();
if(document.readyState==='loading')addEventListener('DOMContentLoaded',init);else init();
