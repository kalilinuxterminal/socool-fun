<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Typing Test — socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#08080e;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  h1{font-size:24px;font-weight:900;letter-spacing:1px}
  h1 span{color:#4da3ff}
  #stats{display:flex;gap:26px;font-weight:900}
  #stats div{text-align:center;min-width:70px}
  #stats b{font-size:30px;display:block}
  #stats span{font-size:10px;color:#888;letter-spacing:2px}
  #stage{width:min(680px,94vw);background:#ffffff08;border:1px solid #ffffff1c;border-radius:18px;padding:22px;line-height:2.1;font-size:clamp(16px,3vw,22px);min-height:150px;user-select:none}
  #stage .w{margin:0 4px;padding:2px 6px;border-radius:6px;color:#9a9ab8}
  #stage .w.ok{color:#fff}
  #stage .w.bad{color:#f66;text-decoration:line-through}
  #stage .w.cur{background:#4da3ff33;box-shadow:inset 0 0 0 1px #4da3ff66;color:#fff}
  #box{width:min(680px,94vw);background:#ffffff10;border:1px solid #ffffff2a;border-radius:14px;padding:14px;font-size:18px;color:#fff;outline:0;text-align:center}
  #box:focus{border-color:#4da3ff;box-shadow:0 0 0 4px #4da3ff22}
  button{background:#fff;color:#000;border:0;border-radius:100px;padding:12px 34px;font-weight:900;cursor:pointer;font-size:14px}
  button:hover{transform:translateY(-1px)}
  .note{font-size:12px;color:#888;text-align:center}
  #board{width:min(680px,94vw);display:none;flex-direction:column;gap:6px}
  .bi{display:flex;justify-content:space-between;background:#ffffff08;border-radius:10px;padding:8px 14px;font-size:14px}
  .bi b{color:#4da3ff}
  .bi.top{border:1px solid #4da3ff55}
  a{color:#777;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<h1>⌨️ TYPING <span>TEST</span></h1>
<div id="stats">
  <div><b id="time">30</b><span>SECONDS</span></div>
  <div><b id="wpm">0</b><span>WPM</span></div>
  <div><b id="acc">100</b><span>ACC %</span></div>
</div>
<div id="stage"></div>
<input id="box" placeholder="click here and start typing…" autocomplete="off" />
<div class="note" id="msg">type the highlighted word — space moves to the next one</div>
<button id="r" style="display:none">GO AGAIN ▸</button>
<div id="board"></div>
<a href="index.html">← socool.fun</a>
<script defer src="vendor/firebase-app-compat.js"></script>
<script defer src="vendor/firebase-auth-compat.js"></script>
<script defer src="vendor/firebase-firestore-compat.js"></script>
<script>
const WORDS=['the','and','for','are','but','not','you','all','can','her','was','one','our','out','day','get','has','him','his','how','man','new','now','old','see','two','way','who','boy','did','its','let','put','say','she','too','use','that','with','have','this','will','your','from','they','know','want','been','good','much','some','time','very','when','come','here','just','like','long','make','many','over','such','take','than','them','well','were','school','class','money','water','world','year','gaming','speed','score','level','focus','grind','study','notes'];
const $=id=>document.getElementById(id);
let pool=[],idx=0,startT=0,done=false,okWords=0,okChars=0,typedWords=0,timer=null;
function isClean(s){return true}
function newPool(){pool=[];for(let i=0;i<50;i++)pool.push(WORDS[Math.floor(Math.random()*WORDS.length)])}
function render(){
  const S=$('stage');S.textContent='';
  pool.forEach((w,i)=>{const sp=document.createElement('span');
    sp.className='w'+(i<idx?(pool.ok&&pool.ok[i]?' ok':' bad'):'')+(i===idx&&!done?' cur':'');
    if(i<idx){if(pool.ok&&pool.ok[i])sp.className='w ok';else sp.className='w bad'}
    else if(i===idx&&!done)sp.className='w cur';else sp.className='w';
    sp.textContent=w;S.appendChild(sp)});
}
function stats(){
  if(!startT)return;
  const mins=(Date.now()-startT)/60000;
  const wpm=mins>0?Math.round((okChars/5)/mins):0;
  $('wpm').textContent=wpm;
  $('acc').textContent=typedWords?Math.round(okWords/typedWords*100):100;
}
function tick(){
  const left=Math.max(0,30-Math.floor((Date.now()-startT)/1000));
  $('time').textContent=left;
  if(left<=0)finish();
}
function finish(){
  if(done)return;done=true;clearInterval(timer);
  const mins=(Date.now()-startT)/60000;
  const wpm=Math.max(0,Math.round((okChars/5)/mins));
  const acc=typedWords?Math.round(okWords/typedWords*100):0;
  $('msg').textContent='FINAL: '+wpm+' WPM · '+acc+'% accuracy — submitted to the leaderboard';
  $('box').value='';$('box').disabled=true;
  $('r').style.display='block';
  render();
  if(window.__submitScore)__submitScore('typing',wpm);
  loadBoard(wpm);
}
function loadBoard(mine){
  const B=$('board');B.style.display='flex';B.textContent='';
  if(typeof firebase==='undefined'){const d=document.createElement('div');d.className='note';d.textContent='leaderboard unavailable on this network';B.appendChild(d);return}
  try{
    firebase.firestore().collection('scores').where('game','==','typing').orderBy('score','desc').limit(5).get().then(s=>{
      const lab=document.createElement('div');lab.className='note';lab.textContent='TOP TYPISTS';B.appendChild(lab);
      let i=1;
      s.forEach(d=>{const r=d.data();
        const it=document.createElement('div');it.className='bi'+(r.score===mine?' top':'');
        it.innerHTML='<span>'+i+'. <b></b></span><span>'+r.score+' wpm</span>';
        it.querySelector('b').textContent=r.name||'anon';
        B.appendChild(it);i++});
      if(s.empty){const d=document.createElement('div');d.className='note';d.textContent='no scores yet — you set the bar';B.appendChild(d)}
    }).catch(()=>{const d=document.createElement('div');d.className='note';d.textContent='could not load leaderboard';B.appendChild(d)});
  }catch(e){}
}
$('box').addEventListener('input',e=>{
  if(done){e.target.value='';return}
  if(!startT){startT=Date.now();timer=setInterval(tick,200);tick()}
  const v=e.target.value;
  if(v.endsWith(' ')){
    const word=v.trim();
    if(word){
      typedWords++;
      const good=word===pool[idx];
      pool.ok=pool.ok||[];
      pool.ok[idx]=good;
      if(good){okWords++;okChars+=word.length+1}
    }
    idx++;e.target.value='';
    if(idx>=pool.length){finish();return}
    stats();render();
  }
});
$('r').onclick=()=>{done=false;idx=0;startT=0;okWords=0;okChars=0;typedWords=0;pool.ok=[];
  clearInterval(timer);$('time').textContent='30';$('wpm').textContent='0';$('acc').textContent='100';
  $('box').disabled=false;$('r').style.display='none';$('board').style.display='none';
  $('msg').textContent='type the highlighted word — space moves to the next one';
  newPool();render();$('box').focus()};
newPool();render();
</script>

if(typeof firebase==='undefined')return;firebase.initializeApp(C);
firebase.auth().signInAnonymously().then(()=>{window.__submitScore=(g,s)=>{try{
  let n='anon';try{n=(JSON.parse(localStorage.sc_name)||{}).name||'anon'}catch(e){}
  if(!s||s<=0)return;
  firebase.firestore().collection('scores').add({game:g,name:n.slice(0,16),uid:firebase.auth().currentUser.uid,score:Math.round(s),ts:Date.now()}).catch(()=>{})}catch(e){}}}).catch(()=>{})}catch(e){}})();
</script>
</body>
</html>
