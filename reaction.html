<title>Reaction Test · socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
  h1{font-size:30px;font-weight:900;background:linear-gradient(90deg,#ffe14d,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}
  #pad{width:min(92vw,560px);height:min(52vh,340px);border-radius:20px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:22px;font-weight:900;cursor:pointer;background:#a00;transition:background .1s;text-align:center;padding:20px}
  #stats{display:flex;gap:22px;font-weight:800}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 34px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888}
</style>
</head>
<body>
<h1>REACTION TEST</h1>
<div id="stats"><span>LAST <span id="l">·</span></span><span>BEST <span id="b">·</span></span><span>AVG5 <span id="a">·</span></span></div>
<div id="pad">TAP TO START</div>
<div class="keys">wait for green, then tap as fast as you can. too early = foul.</div>
<button class="btn" id="r">RESET SCORES</button>
<a href="index.html">← socool.fun</a>
<script>
const pad=document.getElementById('pad');
let st='idle',t0=0,timer=null,times=JSON.parse(localStorage.getItem('sc_react')||'[]');
function rank(ms){if(ms<180)return'INHUMAN';if(ms<220)return'🔥 CRACKED';if(ms<270)return'💪 FAST';if(ms<350)return'🙂 AVERAGE';return'🐢 SLOW'}
function show(){document.getElementById('l').textContent=times.length?Math.round(times[times.length-1])+'ms '+rank(times[times.length-1]):'·';
  document.getElementById('b').textContent=times.length?Math.round(Math.min(...times))+'ms':'·';
  const last5=times.slice(-5);document.getElementById('a').textContent=last5.length?Math.round(last5.reduce((a,b)=>a+b,0)/last5.length)+'ms':'·'}
function wait(){st='wait';pad.style.background='#a00';pad.innerHTML='WAIT FOR GREEN…';timer=setTimeout(()=>{st='go';pad.style.background='#0a0';pad.innerHTML='TAP NOW!';t0=performance.now()},1200+Math.random()*2800)}
pad.onclick=()=>{const n=performance.now();
  if(st==='idle'||st==='done'){wait()}
  else if(st==='wait'){clearTimeout(timer);st='done';pad.style.background='#a00';pad.innerHTML='TOO EARLY! <br><small>tap to retry</small>'}
  else{const ms=n-t0;times.push(ms);if(times.length>50)times.shift();localStorage.setItem('sc_react',JSON.stringify(times));
    if(window.__submitScore&&ms<=Math.min.apply(null,times))__submitScore('reaction',Math.max(0,500-ms));
    st='done';pad.style.background='#223';pad.innerHTML=Math.round(ms)+'ms · '+rank(ms)+'<br><small>tap to go again</small>';show()}};
document.getElementById('r').onclick=()=>{times=[];localStorage.setItem('sc_react','[]');st='idle';pad.style.background='#a00';pad.innerHTML='TAP TO START';show()};
show();
</script>
