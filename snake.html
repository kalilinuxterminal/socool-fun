<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Snake — socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
  h1{font-size:30px;font-weight:900;background:linear-gradient(90deg,#00ff9d,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #bar{display:flex;gap:22px;font-weight:800;letter-spacing:1px}
  canvas{background:#0b0b18;border:2px solid #00ff9d33;border-radius:16px;box-shadow:0 0 40px #00ff9d22;max-width:92vw;max-height:62vh;touch-action:none}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 34px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888}
</style>
</head>
<body>
<h1>🐍 SNAKE</h1>
<div id="bar"><span>SCORE <span id="s">0</span></span><span>BEST <span id="b">0</span></span></div>
<canvas id="g" width="420" height="420"></canvas>
<div class="keys">arrows / WASD / swipe · faster every 5 foods</div>
<button class="btn" id="r">RESTART</button>
<a href="index.html">← socool.fun</a>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),N=21,S=c.width/N;
let sn,dir,nd,food,score,over,tick,best=+(localStorage.getItem('sc_snake')||0);
document.getElementById('b').textContent=best;
function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nd=dir;score=0;over=false;tick=0;place();upd()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(s=>s.x===food.x&&s.y===food.y))}
function upd(){document.getElementById('s').textContent=score}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((k==='arrowup'||k==='w')&&dir.y!==1)nd={x:0,y:-1};
  else if((k==='arrowdown'||k==='s')&&dir.y!==-1)nd={x:0,y:1};
  else if((k==='arrowleft'||k==='a')&&dir.x!==1)nd={x:-1,y:0};
  else if((k==='arrowright'||k==='d')&&dir.x!==-1)nd={x:1,y:0};
  if(k.startsWith('arrow'))e.preventDefault()});
let sx=0,sy=0;
c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
c.addEventListener('touchmove',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nd={x:1,y:0};else if(dx<0&&dir.x!==1)nd={x:-1,y:0}}
  else{if(dy>0&&dir.y!==-1)nd={x:0,y:1};else if(dy<0&&dir.y!==1)nd={x:0,y:-1}}
  sx=t.clientX;sy=t.clientY;e.preventDefault()},{passive:false});
function step(){dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y)){over=true;
    if(score>best){best=score;localStorage.setItem('sc_snake',best);document.getElementById('b').textContent=best}return}
  sn.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=10;upd();place()}else sn.pop()}
function draw(){x.fillStyle='#0b0b18';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#ff2fb3';x.shadowColor='#ff2fb3';x.shadowBlur=14;
  x.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);x.shadowBlur=0;
  sn.forEach((s,i)=>{x.fillStyle=i?'#00ff9d':'#eafff3';x.shadowColor='#00ff9d';x.shadowBlur=i?8:16;
    x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});x.shadowBlur=0;
  if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='900 30px sans-serif';x.textAlign='center';x.fillText('GAME OVER',c.width/2,c.height/2)}}
document.getElementById('r').onclick=reset;reset();
let last=0;function loop(t){requestAnimationFrame(loop);if(t-last>Math.max(55,140-score*0.5)){last=t;if(!over&&!document.hidden){step();draw()}}}requestAnimationFrame(loop);
</script>
</body>
</html>
