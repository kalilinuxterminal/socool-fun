<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Hoops Shootout — socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
  h1{font-size:26px;font-weight:900;letter-spacing:1px}
  h1 span{color:#ff7a00}
  #bar{display:flex;gap:20px;font-weight:800;font-size:15px}
  canvas{background:linear-gradient(#0b1026,#131328);border:2px solid #ffffff2a;border-radius:14px;max-width:96vw;touch-action:none;cursor:crosshair}
  #msg{font-weight:800;min-height:24px;font-size:17px}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 34px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888;text-align:center}
</style>
</head>
<body>
<h1>🏀 HOOPS <span>SHOOTOUT</span></h1>
<div id="bar"><span>YOU <span id="ys">0</span></span><span>⏱️ <span id="t">60</span></span><span>CPU <span id="cs">0</span></span></div>
<canvas id="g" width="640" height="420"></canvas>
<div id="msg">drag from the ball to aim, release to shoot!</div>
<button class="btn" id="r">NEW MATCH</button>
<a href="index.html">← socool.fun</a>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
const GRAV=1500,RIM_Y=150,RIM_L=480,RIM_R=560,BOARD_X=572,GROUND=390;
let you,cpu,time,over,ball,aiming,aim,shooter,streak,best=+(localStorage.getItem('sc_hoops')||0);
function reset(){you=0;cpu=0;time=60;over=false;newBall();upd();msg('drag from the ball to aim, release to shoot!')}
function upd(){document.getElementById('ys').textContent=you;document.getElementById('cs').textContent=cpu;
  document.getElementById('t').textContent=Math.ceil(time)}
function msg(t){document.getElementById('msg').textContent=t}
function newBall(){const d=120+Math.random()*220;
  ball={x:RIM_L-d,y:GROUND-14,vx:0,vy:0,held:true,scored:false,dead:false};shooter='you'}
function aiShoot(){const d=120+Math.random()*220;
  ball={x:RIM_L-d,y:GROUND-14,vx:0,vy:0,held:false,scored:false,dead:false};shooter='cpu';
  // solve-ish arc with skill error
  const dx=(RIM_L+RIM_R)/2-ball.x,dy=RIM_Y-ball.y,T=0.85+Math.random()*0.25;
  const err=(Math.random()<0.55+cpu*0.005)?(Math.random()-0.5)*36:(Math.random()-0.5)*130;
  ball.vx=(dx+err)/T;ball.vy=(dy-0.5*GRAV*T*T)/T;msg('CPU shoots…')}
function shoot(vx,vy){ball.vx=vx;ball.vy=vy;ball.held=false}
function ptr(e){const r=c.getBoundingClientRect();
  const cx=(e.clientX!==undefined?e.clientX:e.changedTouches[0].clientX),cy=(e.clientY!==undefined?e.clientY:e.changedTouches[0].clientY);
  return{x:(cx-r.left)*(c.width/r.width),y:(cy-r.top)*(c.height/r.height)}}
c.addEventListener('pointerdown',e=>{if(over||!ball.held||shooter!=='you')return;
  const p=ptr(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<70){aiming=true;aim=p;e.preventDefault()}});
c.addEventListener('pointermove',e=>{if(aiming)aim=ptr(e)});
addEventListener('pointerup',()=>{if(!aiming)return;aiming=false;
  const vx=(ball.x-aim.x)*4.2,vy=(ball.y-aim.y)*4.2;
  if(Math.hypot(vx,vy)<120){msg('drag further for power!');return}
  shoot(vx,Math.min(vy,-200))});
function step(dt){
  if(ball.held)return;
  ball.vy+=GRAV*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  // backboard
  if(ball.x+10>BOARD_X&&ball.x<BOARD_X+14&&ball.y>RIM_Y-110&&ball.y<RIM_Y+10&&ball.vx>0){ball.x=BOARD_X-10;ball.vx*=-0.55}
  // rim: two points
  for(const rx of[RIM_L,RIM_R]){const dx=ball.x-rx,dy=ball.y-RIM_Y,d=Math.hypot(dx,dy);
    if(d<10+7&&d>0.1){const nx=dx/d,ny=dy/d,dot=ball.vx*nx+ball.vy*ny;
      if(dot<0){ball.vx-=1.6*dot*nx;ball.vy-=1.6*dot*ny;ball.x=rx+nx*17;ball.y=RIM_Y+ny*17}}}
  // swish: crossing rim plane downward between rim edges, moving down, above rim before
  if(!ball.scored&&ball.vy>0&&ball.y>=RIM_Y&&ball.y-ball.vy*dt<RIM_Y&&ball.x>RIM_L+6&&ball.x<RIM_R-6){
    ball.scored=true;
    if(shooter==='you'){you+=2;streak=(streak||0)+1;msg(streak>1?'SWISH! +2 🔥 x'+streak:'SWISH! +2 🔥');
      if(you>best){best=you;localStorage.setItem('sc_hoops',best)}}
    else{cpu+=2;msg('CPU buckets it…')}
    upd()}
  // ground / out
  if(ball.y>GROUND+40||ball.x<-40||ball.x>c.width+40){ball.dead=true}
}
function frame(dt){
  if(!over){
    time-=dt;
    if(ball.dead){if(shooter==='you')aiShoot();else newBall()}
    if(time<=0){time=0;over=true;
      if(window.__submitScore)__submitScore('hoops',you);
      msg(you>cpu?'🏆 YOU WIN!':you<cpu?'🤖 CPU WINS':'🤝 DRAW');
      if(you>best){best=you;localStorage.setItem('sc_hoops',best)}}
    step(dt);upd();
  }
  // draw
  x.fillStyle='#0b1026';x.fillRect(0,0,c.width,c.height);
  x.strokeStyle='rgba(255,255,255,.06)';for(let i=0;i<c.width;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}
  // court floor
  x.fillStyle='#141428';x.fillRect(0,GROUND,c.width,c.height-GROUND);
  x.strokeStyle='#ffffff33';x.beginPath();x.moveTo(0,GROUND);x.lineTo(c.width,GROUND);x.stroke();
  // hoop: pole, board, rim
  x.fillStyle='#222';x.fillRect(BOARD_X+8,RIM_Y-110,10,110);
  x.fillStyle='rgba(255,255,255,.85)';x.fillRect(BOARD_X-4,RIM_Y-110,12,100);
  x.strokeStyle='#ff7a00';x.lineWidth=5;x.shadowColor='#ff7a00';x.shadowBlur=12;
  x.beginPath();x.moveTo(RIM_L,RIM_Y);x.lineTo(RIM_R,RIM_Y);x.stroke();x.shadowBlur=0;x.lineWidth=1;
  // net
  x.strokeStyle='rgba(255,255,255,.5)';x.beginPath();
  x.moveTo(RIM_L,RIM_Y);x.lineTo(RIM_L+14,RIM_Y+34);x.moveTo(RIM_R,RIM_Y);x.lineTo(RIM_R-14,RIM_Y+34);
  x.moveTo(RIM_L+14,RIM_Y+34);x.lineTo(RIM_R-14,RIM_Y+34);x.stroke();
  // shooter marker
  if(ball.held&&shooter==='you'){x.fillStyle='#00e5ff';x.beginPath();x.arc(ball.x,ball.y-34,8,0,7);x.fill();
    x.fillStyle='#fff';x.font='900 13px sans-serif';x.textAlign='center';x.fillText('YOU',ball.x,ball.y-48)}
  // aim arrow
  if(aiming){x.strokeStyle='#ffe14d';x.lineWidth=4;x.setLineDash([8,6]);x.beginPath();x.moveTo(ball.x,ball.y);
    x.lineTo(ball.x+(ball.x-aim.x)*1.6,ball.y+(ball.y-aim.y)*1.6);x.stroke();x.setLineDash([]);x.lineWidth=1}
  // ball
  x.fillStyle=shooter==='you'?'#ff7a00':'#00e5ff';x.shadowColor=x.fillStyle;x.shadowBlur=14;
  x.beginPath();x.arc(ball.x,ball.y,11,0,7);x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(0,0,0,.6)';x.beginPath();x.moveTo(ball.x-11,ball.y);x.lineTo(ball.x+11,ball.y);x.stroke();
  x.beginPath();x.moveTo(ball.x,ball.y-11);x.lineTo(ball.x,ball.y+11);x.stroke();
}
document.getElementById('r').onclick=reset;reset();
let last=performance.now();(function loop(t){requestAnimationFrame(loop);const n=t||performance.now();
  const dt=Math.min(.05,(n-last)/1000);last=n;if(!document.hidden)frame(dt)})();
</script>
