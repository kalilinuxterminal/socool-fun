<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>2048 — socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  h1{font-size:34px;font-weight:900;background:linear-gradient(90deg,#ffe14d,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}
  #bar{display:flex;gap:22px;font-weight:800;letter-spacing:1px}
  #board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#101022;padding:12px;border-radius:16px;border:1px solid #ffe14d33;touch-action:none}
  .cell{width:min(17vw,84px);height:min(17vw,84px);background:#1b1b30;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,5vw,30px)}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 34px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888}
  #msg{font-weight:800;min-height:22px;color:#ffe14d}
</style>
</head>
<body>
<h1>🔢 2048</h1>
<div id="bar"><span>SCORE <span id="s">0</span></span><span>BEST <span id="b">0</span></span></div>
<div id="board"></div>
<div id="msg"></div>
<div class="keys">arrows / WASD / swipe to slide</div>
<button class="btn" id="r">RESTART</button>
<a href="index.html">← socool.fun</a>
<script>
const B=document.getElementById('board');
let g,score,over,won,best=+(localStorage.getItem('sc_2048')||0);
document.getElementById('b').textContent=best;
const COLS={2:'#2a2a44',4:'#35355a',8:'#7c3aed',16:'#9333ea',32:'#00e5ff',64:'#0090ff',128:'#ff2fb3',256:'#ff1f8f',512:'#ffe14d',1024:'#ff7a00',2048:'#fff'};
function reset(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;over=false;won=false;document.getElementById('msg').textContent='';add();add();draw()}
function add(){const e=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!g[r][c])e.push([r,c]);
  if(e.length){const[r,c]=e[Math.floor(Math.random()*e.length)];g[r][c]=Math.random()<0.9?2:4}}
function slide(row){let a=row.filter(v=>v),sc=0;
  for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;sc+=a[i];a.splice(i+1,1)}
  while(a.length<4)a.push(0);return{a:a,sc:sc}}
function move(dx,dy){if(over)return;let moved=false,gained=0;
  for(let i=0;i<4;i++){let src=[];
    for(let j=0;j<4;j++)src.push(dx?g[i][dx>0?3-j:j]:(dy?g[dy>0?3-j:j][i]:g[j][i]));
    const{a,sc}=slide(src);gained+=sc;
    for(let j=0;j<4;j++){const v=a[j],r=dx?i:(dy?dy>0?3-j:j:j),c=dx?(dx>0?3-j:j):i;
      if(g[r][c]!==v)moved=true;g[r][c]=v}}
  if(moved){score+=gained;add();draw();
    if(gained>0&&score>best){best=score;localStorage.setItem('sc_2048',best);document.getElementById('b').textContent=best}
    if(!won&&g.some(r=>r.includes(2048))){won=true;document.getElementById('msg').textContent='🎉 YOU HIT 2048 — keep going!'}
    if(!canMove()){over=true;document.getElementById('msg').textContent='💀 GAME OVER'}}
  document.getElementById('s').textContent=score}
function canMove(){for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!g[r][c])return true;
  if(c<3&&g[r][c]===g[r][c+1])return true;if(r<3&&g[r][c]===g[r+1][c])return true}return false}
function draw(){B.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=document.createElement('div');d.className='cell';
  const v=g[r][c];d.textContent=v||'';d.style.background=COLS[v]||'#fff';if(v>=2048)d.style.color='#000';B.appendChild(d)}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')move(-1,0);else if(k==='arrowright'||k==='d')move(1,0);
  else if(k==='arrowup'||k==='w')move(0,-1);else if(k==='arrowdown'||k==='s')move(0,1);else return;e.preventDefault()});
let sx=0,sy=0;
B.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
B.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
B.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)});
document.getElementById('r').onclick=reset;reset();
</script>
</body>
</html>
