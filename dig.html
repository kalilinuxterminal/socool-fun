<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Dig Out — socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
  h1{font-size:26px;font-weight:900;background:linear-gradient(90deg,#c98a3d,#ffe14d);-webkit-background-clip:text;background-clip:text;color:transparent}
  #bar{display:flex;gap:16px;font-weight:800;font-size:14px}
  canvas{background:#0a0a12;border:2px solid #c98a3d55;border-radius:12px;box-shadow:0 0 40px #c98a3d22;max-width:94vw;touch-action:none}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 30px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888;text-align:center}
  #pad{display:none;grid-template-columns:repeat(3,64px);gap:6px}
  #pad button{width:64px;height:56px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;font-size:22px}
  @media(pointer:coarse){#pad{display:grid}}
</style>
</head>
<body>
<h1>⛏️ DIG OUT</h1>
<div id="bar"><span>🔑 <span id="k">0</span>/3</span><span>💎 <span id="g">0</span></span><span>LVL <span id="l">1</span></span></div>
<canvas id="g_" width="480" height="480"></canvas>
<div class="keys">arrows/WASD to move + dig · grab 3 keys, dodge boulders, reach the 🚪<br>don't let a 🪨 land on you</div>
<div id="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
<button class="btn" id="r">RESTART</button>
<a href="index.html">← socool.fun</a>
<script>
const c=document.getElementById('g_'),x=c.getContext('2d');
const T=32;let COLS,ROWS,lvl,grid,px,py,keys,gems,over,win,fallT;
let best=0;
function gen(l){COLS=15;ROWS=15;grid=[];
  for(let r=0;r<ROWS;r++){grid.push([]);for(let q=0;q<COLS;q++){
    let v=(r===0||q===0||r===ROWS-1||q===COLS-1)?'#':((r<2&&q<3)?'.':'d');
    grid[r].push(v)}}
  // carve start room
  grid[1][1]='.';grid[1][2]='.';grid[2][1]='.';
  px=1;py=1;keys=0;gems=0;over=false;win=false;fallT=0;
  const put=(v,n,fn)=>{let p=0,g=0;while(p<n&&g++<800){const r=2+Math.floor(Math.random()*(ROWS-3)),q=1+Math.floor(Math.random()*(COLS-2));
    if(grid[r][q]==='d'&&(!fn||fn(r,q))){grid[r][q]=v;p++}}};
  put('K',3);put('G',6+l*2);put('R',4+l*2,(r,q)=>r>4);
  grid[ROWS-2][COLS-2]='E'}
function reset(){gen(lvl||1);upd()}
function upd(){document.getElementById('k').textContent=keys;document.getElementById('g').textContent=gems;document.getElementById('l').textContent=lvl||1}
function move(dx,dy){if(over||win)return;
  const nx=px+dx,ny=py+dy,t=grid[ny]&&grid[ny][nx];
  if(t===undefined||t==='#'||t==='R')return;
  if(t==='K'){keys++;grid[ny][nx]='.'}
  else if(t==='G'){gems++;grid[ny][nx]='.'}
  else if(t==='d'){grid[ny][nx]='.'}
  else if(t==='E'){if(keys>=3){win=true;lvl=(lvl||1)+1;setTimeout(()=>{gen(lvl);upd()},600);upd();draw();return}return}
  px=nx;py=ny;upd();draw()}
function physics(dt){fallT+=dt;if(fallT<0.12)return;fallT=0;
  for(let r=ROWS-2;r>=0;r--)for(let q=0;q<COLS;q++){
    if(grid[r][q]==='R'&&grid[r+1][q]==='.'){grid[r+1][q]='R';grid[r][q]='.';
      if(px===q&&py===r+1){over=true}}}
  if(over)draw()}
function draw(){x.fillStyle='#0a0a12';x.fillRect(0,0,c.width,c.height);
  for(let r=0;r<ROWS;r++)for(let q=0;q<COLS;q++){const v=grid[r][q],X=q*T,Y=r*T;
    if(v==='#'){x.fillStyle='#1c1c30';x.fillRect(X,Y,T,T)}
    else if(v==='d'){x.fillStyle='#4a2f18';x.fillRect(X,Y,T,T);x.fillStyle='#5d3c20';x.fillRect(X+3,Y+3,T-6,T-6);
      x.fillStyle='#3a2412';for(let i=0;i<5;i++)x.fillRect(X+5+((r*7+q*13+i*11)%(T-10)),Y+5+((r*5+q*11+i*7)%(T-10)),3,3)}
    else if(v==='K'){x.font='22px sans-serif';x.textAlign='center';x.fillText('🔑',X+T/2,Y+24)}
    else if(v==='G'){x.fillStyle='#00e5ff';x.shadowColor='#00e5ff';x.shadowBlur=10;
      x.beginPath();x.moveTo(X+16,Y+6);x.lineTo(X+26,Y+6);x.lineTo(X+30,Y+16);x.lineTo(X+16,Y+28);x.lineTo(X+2,Y+16);x.lineTo(X+6,Y+6);x.fill();x.shadowBlur=0}
    else if(v==='R'){x.fillStyle='#777';x.shadowColor='#999';x.shadowBlur=6;x.beginPath();x.arc(X+16,Y+16,13,0,7);x.fill();x.shadowBlur=0;
      x.fillStyle='#555';x.beginPath();x.arc(X+11,Y+11,4,0,7);x.fill()}
    else if(v==='E'){x.font='22px sans-serif';x.textAlign='center';x.fillText(keys>=3?'🚪':'🔒',X+T/2,Y+24)}}
  // player
  x.font='24px sans-serif';x.textAlign='center';x.fillText('🧑‍🌾',px*T+16,py*T+25);
  if(over){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='900 30px sans-serif';x.fillText('SQUISHED!',c.width/2,c.height/2);x.font='700 16px sans-serif';x.fillText('tap RESTART',c.width/2,c.height/2+32)}
  if(win){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ffe14d';x.font='900 30px sans-serif';x.fillText('ESCAPED! ⬇',c.width/2,c.height/2)}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')move(0,-1);else if(k==='arrowdown'||k==='s')move(0,1);
  else if(k==='arrowleft'||k==='a')move(-1,0);else if(k==='arrowright'||k==='d')move(1,0);else return;e.preventDefault()});
let tsx=0,tsy=0;
c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY},{passive:true});
c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)});
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>{const[dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)});
document.getElementById('r').onclick=()=>{lvl=1;reset();draw()};
lvl=1;reset();draw();
let last=performance.now();(function loop(t){requestAnimationFrame(loop);const n=t||performance.now();const dt=Math.min(.1,(n-last)/1000);last=n;if(!document.hidden&&!over&&!win)physics(dt)})();
</script>
</body>
</html>
