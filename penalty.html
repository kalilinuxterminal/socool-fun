<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Penalty Kick · socool.fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}
  body{background:#07070f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
  h1{font-size:28px;font-weight:900;background:linear-gradient(90deg,#7CFC00,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #bar{display:flex;gap:20px;font-weight:800}
  #pitch{position:relative;width:min(94vw,560px);height:min(60vh,380px);background:linear-gradient(#0d3d1a,#08240f);border:3px solid #ffffff2c;border-radius:16px;overflow:hidden;cursor:crosshair;touch-action:none}
  #goal{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:64%;height:52%;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:rgba(255,255,255,.06)}
  #net{position:absolute;inset:0;background-image:linear-gradient(#ffffff18 1px,transparent 1px),linear-gradient(90deg,#ffffff18 1px,transparent 1px);background-size:22px 22px}
  #keeper{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:52px;transition:left .28s ease-in}
  #ball{position:absolute;left:50%;bottom:8%;transform:translate(-50%,0);font-size:40px;transition:left .3s ease-in,top .3s ease-in,transform .3s}
  #aim{position:absolute;width:26px;height:26px;border:3px solid #ffe14d;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;box-shadow:0 0 12px #ffe14d}
  #msg{font-weight:900;font-size:20px;min-height:28px}
  .btn{background:#fff;color:#000;border:0;border-radius:100px;padding:10px 34px;font-weight:800;cursor:pointer}
  a{color:#777;font-size:12px;text-decoration:none}
  .keys{font-size:12px;color:#888}
</style>
</head>
<body>
<h1>PENALTY KICK</h1>
<div id="bar"><span>GOALS <span id="g">0</span>/5</span><span>STREAK <span id="s">0</span></span><span>BEST <span id="b">0</span></span></div>
<div id="pitch"><div id="goal"><div id="net"></div></div><div id="keeper">▲</div><div id="ball"></div><div id="aim"></div></div>
<div id="msg">click inside the goal to shoot!</div>
<button class="btn" id="r">RESTART</button>
<a href="index.html">← socool.fun</a>
<script>
const pitch=document.getElementById('pitch'),keeper=document.getElementById('keeper'),
ball=document.getElementById('ball'),aim=document.getElementById('aim'),msg=document.getElementById('msg');
let shots,goals,streak,best=+(localStorage.getItem('sc_pen')||0),busy=false,round=1;
document.getElementById('b').textContent=best;
function reset(){shots=0;goals=0;busy=false;upd();msg.textContent='click inside the goal to shoot!';
  keeper.style.left='50%';ball.style.left='50%';ball.style.top='';ball.style.bottom='8%';ball.style.transform='translate(-50%,0)'}
function upd(){document.getElementById('g').textContent=goals+'/5';document.getElementById('s').textContent=streak}
function rect(el){return el.getBoundingClientRect()}
pitch.addEventListener('mousemove',e=>{const r=rect(pitch);
  aim.style.display='block';aim.style.left=(e.clientX-r.left)+'px';aim.style.top=(e.clientY-r.top)+'px'});
pitch.addEventListener('mouseleave',()=>aim.style.display='none');
pitch.addEventListener('pointerdown',e=>{if(busy)return;
  const r=rect(pitch),gr=rect(document.getElementById('goal'));
  const px=e.clientX-r.left,py=e.clientY-r.top;
  if(px<gr.left-r.left||px>gr.right-r.left||py<gr.top-r.top||py>gr.bottom-r.top){msg.textContent='OFF TARGET!';return}
  shoot(px,py)});
function shoot(px,py){busy=true;
  const r=rect(pitch);
  const tx=px/r.width*100,ty=py/r.height*100;
  ball.style.left=tx+'%';ball.style.top=ty+'%';ball.style.bottom='auto';ball.style.transform='translate(-50%,-50%) scale(.6)';
  // keeper reads you: better rounds = better keeper
  const readCh=0.45+round*0.06;
  const gx=50+(tx-50)*(Math.random()<readCh?0.85:0.2)+(Math.random()-0.5)*14;
  keeper.style.left=Math.max(28,Math.min(72,gx))+'%';
  setTimeout(()=>{
    const kx=parseFloat(keeper.style.left),dist=Math.abs(kx-tx);
    shots++;
    if(dist<9){msg.textContent='SAVED!';streak=0}
    else{goals++;streak++;msg.textContent=['GOAL!','TOP BINS!','CLINICAL! '][Math.floor(Math.random()*3)];
      if(streak>best){best=streak;localStorage.setItem('sc_pen',best);document.getElementById('b').textContent=best}}
    upd();
    setTimeout(()=>{
      ball.style.left='50%';ball.style.top='';ball.style.bottom='8%';ball.style.transform='translate(-50%,0)';keeper.style.left='50%';
      if(shots>=5){msg.textContent=`FULL TIME: ${goals}/5`+(goals===5?' · PERFECT!':'');round++;shots=0;goals=0;setTimeout(upd,10)}
      busy=false},700);
  },320)}
document.getElementById('r').onclick=()=>{round=1;reset()};reset();
</script>
</body>
</html>
